<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- relatívne cesty riešime od koreňa → funguje aj na /s/{token} (žiacky link) -->
<base href="/">
<title>Karel 2030</title>
<link rel="stylesheet" href="vendor/codemirror.min.css"
      onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css'">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Toolbar ===== -->
<header id="toolbar">
  <span id="brand"><span class="brand-badge">K</span> Karel 2030</span>
  <label class="tb-label teacher-only"><span>Svety:</span>
    <select id="worlds"></select>
  </label>
  <button class="tb teacher-only" id="btn-world-open" title="Otvoriť svet zo súboru (.karxml)">📂</button>
  <button class="tb teacher-only" id="btn-world-save" title="Uložiť svet do súboru (.karxml)">💾</button>
  <button class="tb admin-only" id="btn-world-pub" title="Publikovať / uložiť zdieľaný svet (admin)">📤</button>
  <button class="tb admin-only" id="btn-world-del" title="Zmazať vybraný publikovaný svet (admin)">🗑</button>
  <button class="tb teacher-only accent" id="btn-share" title="Zdieľať aktuálny svet žiakom (vygeneruje linky)">👥 Zdieľaj</button>
  <span class="tb-sep teacher-only"></span>
  <button id="btn-task"  class="tb" data-i18n="toolbar.task">📋 Zadanie</button>
  <button id="btn-run"   class="tb accent" data-i18n="toolbar.run">▶ Spustiť</button>
  <button id="btn-stop"  class="tb" disabled data-i18n="toolbar.stop">⏹ Stop</button>
  <button id="btn-reset" class="tb" data-i18n="toolbar.reset">↺ Reset</button>
  <button id="btn-settings" class="tb teacher-only" data-i18n="menu.world_settings">⚙ Nastavenia</button>
  <label class="tb-label"><span data-i18n="toolbar.speed">Rýchlosť:</span>
    <input id="speed" type="range" min="0" max="100" value="60">
  </label>
  <label class="tb-label" id="examples-wrap"><span data-i18n="toolbar.examples">Príklady:</span>
    <select id="examples"></select>
  </label>
  <input type="file" id="file-world" accept=".karxml,.xml" class="hidden">
  <input type="file" id="file-prog" accept=".prg,.txt,.karel" class="hidden">
  <label class="tb-label" title="Jazyk rozhrania"><span>🌐</span>
    <select id="ui-lang"></select>
  </label>
  <span id="status" data-i18n="status.ready">Pripravený</span>
  <span id="version" title="verzia / build"></span>
  <span id="conn-dot" title="offline"></span>
</header>

<!-- ===== Main layout ===== -->
<div id="main">
  <!-- 3D scéna -->
  <div id="scene-wrap">
    <canvas id="scene"></canvas>
    <div id="world-title"></div>
  </div>

  <!-- Pravý stĺpec -->
  <div id="side">
    <section class="panel" id="navigator">
      <h2 data-i18n="nav.title">Navigátor</h2>
      <table id="inv-table">
        <thead><tr>
          <th data-i18n="nav.col_item">Predmet</th>
          <th data-i18n="nav.col_left">Zostatok</th>
        </tr></thead>
        <tbody>
          <tr><td data-i18n="nav.small_brick">Malá Tehla</td><td id="inv-bricks">∞</td></tr>
          <tr><td data-i18n="nav.big_brick">Veľká Tehla</td><td id="inv-big">∞</td></tr>
          <tr><td data-i18n="nav.mark">Značka</td><td id="inv-marks">∞</td></tr>
          <tr id="row-steps" class="hidden"><td>Kroky</td><td id="inv-steps"></td></tr>
          <tr id="row-turns" class="hidden"><td>Otočenia</td><td id="inv-turns"></td></tr>
        </tbody>
      </table>
      <div id="karel-pos"></div>
      <div id="view-presets">
        <button class="view-btn" data-az="225" data-el="28" data-i18n="nav.view_def">↙ Def</button>
        <button class="view-btn" data-az="180" data-el="20" data-i18n="nav.view_front">↖ Pred</button>
        <button class="view-btn" data-az="225" data-el="85" data-i18n="nav.view_top">⬆ Vrch</button>
        <button class="view-btn" data-az="135" data-el="18" data-i18n="nav.view_side">↔ Bok</button>
      </div>
    </section>

    <section class="panel" id="control">
      <h2 data-i18n="control.title">Ovládanie Karla</h2>
      <div id="ctl-tabs">
        <button class="ctl-tab active" data-tab="graphic" data-i18n="control.tab_graphic">Graficky</button>
        <button class="ctl-tab" data-tab="command" data-i18n="control.tab_command">Príkazovo</button>
      </div>

      <div id="tab-graphic">
        <div id="dpad">
          <button class="ctl" id="ctl-fwd"  data-cmd="FORWARD" title="dopredu">▲</button>
          <button class="ctl" id="ctl-left" data-cmd="LEFT"    title="vlavo">◀</button>
          <button class="ctl" id="ctl-right"data-cmd="RIGHT"   title="vpravo">▶</button>
          <button class="ctl" id="ctl-back" data-cmd="BACK"    title="dozadu">▼</button>
        </div>
        <div id="actions">
          <button class="act" data-cmd="DROP">Polož<br>tehlu</button>
          <button class="act" data-cmd="DROP_BIG">Polož<br>veľkú</button>
          <button class="act" data-cmd="PICK">Zdvihni<br>tehlu</button>
          <button class="act" data-cmd="MARK">Označ<br>★</button>
          <button class="act" data-cmd="CLEAR">Odznač<br>★</button>
        </div>
      </div>

      <div id="tab-command" class="hidden">
        <div id="cmd-log"></div>
        <input id="cmd-input" type="text" autocomplete="off" spellcheck="false"
               data-i18n-ph="control.cmd_prompt" placeholder="Príkaz (Enter = vykonaj):">
      </div>
    </section>
  </div>
</div>

<!-- ===== Editor + zoznam príkazov ===== -->
<div id="bottom">
  <div id="editor-wrap">
    <h2>
      <span data-i18n="program_panel.title">Môj program...</span>
      <button class="mini-btn" id="btn-prog-open" title="Otvoriť program zo súboru">📂</button>
      <button class="mini-btn" id="btn-prog-save" title="Uložiť program do súboru">💾</button>
    </h2>
    <textarea id="code"></textarea>
  </div>
  <div class="panel" id="cmds-panel">
    <h2 data-i18n="program_panel.cmd_list_hdr">Príkazy</h2>
    <input id="cmds-filter" type="text" autocomplete="off"
           data-i18n-ph="program_panel.filter_hdr" placeholder="Filter">
    <div id="cmds-groups"></div>
  </div>
</div>

<!-- ===== Modálne dialógy ===== -->
<div id="overlay" class="hidden">
  <div id="dialog">
    <h3 id="dlg-title"></h3>
    <div id="dlg-body"></div>
    <div id="dlg-buttons"></div>
  </div>
</div>

<!-- Nastavenia sveta (učiteľ) — samostatný väčší overlay, napĺňa settings.js -->
<div id="settings-overlay" class="hidden">
  <div id="settings-dialog">
    <h3 id="set-title" data-i18n="world_settings.title">Nastavenia sveta</h3>
    <div id="set-tabs"></div>
    <div id="set-body"></div>
    <div id="set-buttons">
      <button id="set-cancel" data-i18n="world_settings.btn_cancel">Zrušiť</button>
      <button id="set-apply" class="accent" data-i18n="world_settings.btn_apply">Použiť a zavrieť</button>
    </div>
  </div>
</div>

<!-- Vendor knižnice: lokálne (offline Docker, viď vendor/get_vendor.py),
     s CDN fallbackom pre vývoj kým vendor súbory nie sú stiahnuté. -->
<script>
function loadSeq(list, done) {  // sekvenčný loader s fallback URL
  if (!list.length) { done(); return; }
  var item = list.shift(), urls = item.slice();
  (function tryNext() {
    var url = urls.shift();
    if (!url) { console.error('Nepodarilo sa načítať', item[0]); loadSeq(list, done); return; }
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { loadSeq(list, done); };
    s.onerror = tryNext;
    document.body.appendChild(s);
  })();
}
loadSeq([
  ['vendor/three.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'],
  ['vendor/OrbitControls.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'],
  ['vendor/codemirror.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js'],
  ['vendor/simple.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js'],
  ['js/api.js'], ['js/mock.js'], ['js/render3d.js'], ['js/editor.js'], ['js/settings.js'], ['js/app.js'],
], function () {});
</script>
</body>
</html>
